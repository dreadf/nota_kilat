name: nota_kilat
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.3
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Paket pdf 3.12 membatasi archive ke 4.0.9, tetapi image 4.11.0 butuh archive
# yang lebih baru sehingga build web gagal. Kunci image ke 4.10.1 sampai pdf
# diperbarui. Jangan dihapus tanpa mengetes `flutter run -d chrome`.
dependency_overrides:
  image: 4.10.1

flutter:
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf